name: E2E

# The Playwright smoke tests (`npm run test:e2e`, tests/e2e/): an endless run, a
# Daily with its share text, the admin login — against the production build on a
# freshly seeded database. Only on pull requests into `main`, i.e. the release
# and hotfix PRs: pushes to `develop` stay quick, and `verify` keeps commits fast.
# Needs no secrets: the database is a local file made for the run.
on:
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e

      # Traces of the failed tests: screenshots, DOM and network of each step
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
