name: CI

# Vercel builds every push, but it only runs `vite build` — it never lints,
# never type-checks and never runs the tests. This is the gate that does.
on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, check and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

      - name: svelte-check
        run: npm run check

      - name: Vitest
        run: npm run test

      # No env vars: the database client is lazy and reads $env/dynamic/private
      # at request time, so a production build needs no credentials.
      - name: Build
        run: npm run build
