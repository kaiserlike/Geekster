name: Migrate

# Applies `drizzle/` to the stage a branch deploys to — `develop` → staging,
# `main` → production — then checks the database: integrity, foreign keys,
# every migration recorded. A failure means the schema is not what the branch
# expects — fix forward. After production, `develop` is fast-forwarded to
# `main` (`sync-develop`).
#
# Production is ordered by Vercel, not by this file: "Migrate production" is a
# Deployment Check of the Vercel project, so a production build is only aliased
# to geekster.pro once this job is green. Staging has no such check and races
# Vercel's deploy, which is safe because every migration keeps the previous code
# working (docs/runbooks/schema-migrations.md).
#
# Separate from ci.yml on purpose: CI cancels a superseded run, and a migration
# must never be cancelled halfway. Not gated on CI either, so it lands as early
# as it can.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  staging:
    name: Migrate staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # The Turso staging URL and token are secrets of this environment only, and
    # the environment admits only `develop`.
    environment: staging
    env:
      TURSO_STAGING_DATABASE_URL: ${{ secrets.TURSO_STAGING_DATABASE_URL }}
      TURSO_STAGING_AUTH_TOKEN: ${{ secrets.TURSO_STAGING_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:staging

      - name: Check the database
        run: npm run db:check -- --target=staging

  production:
    # The job name is the Deployment Check selected in Vercel: renaming it
    # silently drops the check, so rename it there too.
    name: Migrate production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Not `Production`: that environment belongs to Vercel's deployment records.
    # This one admits only `main` and holds the production Turso URL and token.
    environment: production-database
    env:
      TURSO_PRODUCTION_DATABASE_URL: ${{ secrets.TURSO_PRODUCTION_DATABASE_URL }}
      TURSO_PRODUCTION_AUTH_TOKEN: ${{ secrets.TURSO_PRODUCTION_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:migrate:production

      - name: Check the database
        run: npm run db:check -- --target=production

  sync-develop:
    # After a release or a hotfix, `develop` must contain `main` again: the
    # release's merge commit exists only on `main`. Runs after the production
    # migration, so `develop` is never ahead of a migration that failed.
    name: Fast-forward develop
    needs: production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only ever a fast-forward — never a merge commit, never a resolved
      # conflict. If `develop` has commits `main` lacks, this fails and a human
      # merges `main` into `develop`. Pushes the migrated commit, not whatever
      # `main` is by now.
      - name: Fast-forward develop to main
        id: sync
        run: |
          before=$(git rev-parse origin/develop)
          if [ "$before" = "$GITHUB_SHA" ]; then
            echo "develop is already at $GITHUB_SHA"
            echo "moved=false" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$before" "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/develop"
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::develop has commits main lacks. Merge by hand: git checkout develop && git merge origin/main && git push"
            exit 1
          fi

      # A push made with GITHUB_TOKEN starts no workflow, so staging would deploy
      # a hotfix without its migration. A dispatch is the one event that token
      # may start.
      - name: Migrate staging at the new develop
        if: steps.sync.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run migrate.yml --ref develop
